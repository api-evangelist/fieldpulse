  /material-lists:
    get:
      tags:
      - Material Lists
      summary: Get list of Material Lists
      parameters:
      - name: page
        in: query
        schema:
          type: string
        description: Page number. Starts from 1, defaults to 1.
        example: <string>
      - name: limit
        in: query
        schema:
          type: string
        description: Defaults to 50 items per page
        example: <string>
      - name: search
        in: query
