          description: Internal Server Error
          content:
            application/json:
              example:
                message: Internal Server Error
      operationId: postMaterialListsByIdDisconnect
  /material-lists/{id}/item-connect:
    post:
      tags:
      - Material Lists
      summary: Connect Material List item to entity
      requestBody:
        content:
          application/json:
            schema:
