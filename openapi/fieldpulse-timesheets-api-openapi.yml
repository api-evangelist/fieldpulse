openapi: 3.2.0
info:
  title: FieldPulse Timesheets API
  description: 'REST API for the FieldPulse field service management platform.


    **Authentication:** All requests require an `x-api-key` header. Contact support@fieldpulse.com to obtain your API key.


    **Important:** The API Playground below makes live requests against your production data. Use caution when testing write operations (POST, PUT, DELETE).'
  version: 1.0.0
servers:
- url: https://ywe3crmpll.execute-api.us-east-2.amazonaws.com/stage
  description: Production
security:
- apiKeyAuth: []
tags:
- name: Timesheets
paths:
  /timesheets/{id}:
    get:
      tags:
      - Timesheets
      summary: Retrieve timesheet by ID
      description: Retrieve a timesheet by ID
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                message: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              example:
                message: Request URL or object not found
        '500':
          description: Internal Server Error
          content:
            application/json:
              example:
                message: Internal Server Error
      operationId: getTimesheetsById
    put:
      tags:
      - Timesheets
      summary: Update timesheet by ID
      description: Update a timesheet
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                user_id: ''
                clock_in_title: ''
                clock_out_title: ''
                clock_in_method: ''
                clock_out_method: ''
                clock_in_time: ''
                clock_out_time: ''
                clock_in_notes: ''
                clock_out_notes: ''
                clock_in_location: ''
                clock_out_location: ''
                job_id: ''
                subtask_id: ''
                type: ''
                is_historical: ''
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                error: true
                errors:
                - error message
                - error message
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                message: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              example:
                message: Request URL or object not found
        '500':
          description: Internal Server Error
          content:
            application/json:
              example:
                message: Internal Server Error
      operationId: putTimesheetsById
    delete:
      tags:
      - Timesheets
      summary: Delete timesheet by ID
      description: Delete a timesheet
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                message: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              example:
                message: Request URL or object not found
        '500':
          description: Internal Server Error
          content:
            application/json:
              example:
                message: Internal Server Error
      operationId: deleteTimesheetsById
  /timesheets:
    get:
      tags:
      - Timesheets
      summary: Retrieve timesheets list
      description: List timesheets
      parameters:
      - name: limit
        in: query
        schema:
          type: string
        description: Defaults to 20 items per page, maximum 100 items allowed.
        example: <string>
      - name: user_id
        in: query
        schema:
          type: string
        description: Filter by user id
        example: <string>
      - name: in_time
        in: query
        schema:
          type: string
        description: Clock in time UNIX timestamp.
        example: <string>
      - name: out_time
        in: query
        schema:
          type: string
        description: Clock out time UNIX timestamp
        example: <string>
      - name: type
        in: query
        schema:
          type: string
        description: Filter by type. Example - job
        example: <string>
      - name: calculate_count
        in: query
        schema:
          type: string
        description: true or false. If true, in response will be included also total count
        example: <boolean>
      - name: filter
        in: query
        schema:
          type: string
        description: Array of attribute, operator, and value parts.
        example: <array>
      - name: sort
        in: query
        schema:
          type: string
        description: Array of attribute and order values.
        example: <array>
      - name: rel
        in: query
        schema:
          type: string
        description: array consisting of indices with the desired relation to include
        example: <array>
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                message: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              example:
                message: Request URL not found
        '500':
          description: Internal Server Error
          content:
            application/json:
              example:
                message: Internal Server Error
      operationId: getTimesheets
    post:
      tags:
      - Timesheets
      summary: Create a timesheet
      description: Create a timesheet
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                user_id: ''
                clock_in_title: ''
                clock_out_title: ''
                clock_in_method: ''
                clock_out_method: ''
                clock_in_time: ''
                clock_out_time: ''
                clock_in_notes: ''
                clock_out_notes: ''
                clock_in_location: ''
                clock_out_location: ''
                job_id: ''
                subtask_id: ''
                type: ''
                is_historical: ''
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                error: true
                errors:
                - error message
                - error message
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                message: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              example:
                message: Request URL not found
        '500':
          description: Internal Server Error
          content:
            application/json:
              example:
                message: Internal Server Error
      operationId: postTimesheets
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
