- aid: fieldpulse:fieldpulse-docs-mcp
  name: FieldPulse Docs MCP Server
  description: 'FieldPulse serves an anonymous, publicly reachable Model Context Protocol
    server from its documentation host at https://help.fieldpulse.com/mcp. The server
    reports protocol version 2025-06-18 and exposes two read-only tools — a documentation
    search tool and a read-only virtual-filesystem query tool over the docs pages and
    the OpenAPI specs — plus MCP resources carrying the published FieldPulse agent
    skill. It is a documentation-retrieval server, not a wrapper around the FieldPulse
    REST API.'
  humanURL: https://help.fieldpulse.com/
  baseURL: https://help.fieldpulse.com/mcp
