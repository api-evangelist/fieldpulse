aid: fieldpulse
name: FieldPulse
description: 'FieldPulse is an all-in-one field service management (FSM) platform,
  founded in 2015 and headquartered in Dallas, Texas, serving residential and commercial
  service contractors across HVAC/R, electrical, plumbing, garage door, locksmith,
  appliance repair, fire and security, septic, glass, and property management trades.
  The platform combines scheduling and dispatch, customer and job management, estimates,
  invoices, payments, purchase orders, material lists, timesheets, projects, custom
  forms, reporting, and workflow automation, with add-on products for VoIP (Engage),
  Operator AI, Pricebook, FieldPulse Payments, and fleet tracking. FieldPulse publishes
  a public REST API — the "Open API", available on the Enterprise plan — documented
  on a Mintlify docs site with a machine-readable OpenAPI 3.0 definition covering 57
  paths and 109 operations across 25 resource areas, authenticated with an x-api-key
  header issued by support, rate limited to 50 requests per second, plus an outbound
  webhook surface for job, estimate, and invoice events.'
