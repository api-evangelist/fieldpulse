apis:
- aid: fieldpulse:fieldpulse-api
  name: FieldPulse API
  description: 'The FieldPulse Open API is a REST API for the FieldPulse field service
    management platform. It exposes 109 operations across 57 paths covering assets,
    asset categories, comments, company profile, contracts, customers, custom fields,
    estimates, invoices, items, jobs, lead sources, locations, material lists, payments,
    pipeline status, projects, purchase orders, subtasks, tags, teams, timesheets,
    users, vendors, and version. All requests authenticate with an x-api-key header
    issued by FieldPulse support, responses are JSON, and the API is rate limited to
    50 requests per second with a RateLimit-Reset header on 429 responses.'
  humanURL: https://help.fieldpulse.com/api-reference/overview
  baseURL: https://ywe3crmpll.execute-api.us-east-2.amazonaws.com/stage
  tags:
